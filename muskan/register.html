<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Student Registration Form</title>

    <style>
        body {
            background: #f3f4f7;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .header {
            text-align: center;
            padding: 15px;
            background: white;
            border-top: 4px solid #a855f7;
            border-radius: 10px;
            box-shadow: 0 4px 6px -2px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .header h1 {
           font-size: 36px;
            margin: 0;
            color: #7e22ce;
        }
        p{
            color:rgb(107, 107, 107);
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 25px;
            border-left: 4px solid #c084fc;
            padding-left: 8px;
            color: #333;
            font-size: 22px;
        }

        .row {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .field {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            margin-bottom: 5px;
            color: #555;
        }

        input, select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input[type="file"] {
            padding: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #7c3aed;
            border: none;
            font-size: 18px;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        .message {
            margin-top: 25px;
            background: #d1fae5;
            padding: 12px;
            border-left: 5px solid #047857;
            color: #065f46;
            border-radius: 6px;
            display: none;
            text-align: center;
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            h1 {
                font-size: 22px;
            }
            h2 {
                font-size: 18px;
            }
            input, select {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Student Registration Form</h1>
        <p>Please fill out this form completely to register yourself.</p>
    </div>

    <div class="container">
        <form id="regForm">

            <!-- Student Info -->
            <h2>Student Information</h2>

            <div class="row">
                <div class="field">
                    <input type="text" id="fname" name="fname" placeholder="First Name" required>
                </div>

                <div class="field">
                    <input type="text" id="mname" name="mname" placeholder="Middle Name (Optional)" required>
                </div>

                <div class="field">
                    <input type="text" id="lname" name="lname" placeholder="Last Name"  required>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Date of Birth:</label>
                    <input type="date" id="dob" name="dob" value="" required>
                </div>

                <div class="field">
                    <label>Roll Number:</label>
                    <input type="text" id="roll" name="roll" placeholder="Roll Number" required>
                </div>
            </div>

            <!-- Address -->
            <h2>Address</h2>

            <div class="row">
                <div class="field">
                    <input type="text" id="street" name="street" placeholder="Street Address" required>
                </div>

                <div class="field">
                    <input type="text" id="city" name="city" placeholder="City" required>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <input type="text"id="state" name="state" placeholder="State/Province" required>
                </div>

                <div class="field">
                    <input type="text" id="zipcode" name="zipcode" placeholder="Zip Code" required>
                </div>

                <div class="field">
                    <input type="text" id="country" name="country" placeholder="Country" required>
                </div>
            </div>

            <!-- Contact -->
            <h2>Contact Information</h2>

            <div class="row">
                <div class="field">
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </div>

                <div class="field">
                    <input type="tel" id="tel" name="tel" placeholder="Phone Number" required>
                </div>
            </div>

            <!-- Course -->
            <h2>Course Selection</h2>

            <div class="row">
                <div class="field">
                    <label>Select Course:</label>
                    <select required>
                        <option value="">-- Select --</option>
                        <option value="bca">BCA</option>
                        <option value="mca">MCA</option>
                        <option value="bba">BBA</option>
                    </select>
                </div>

                <div class="field">
                    <label>Admission Date:</label>
                    <input type="date" id="admissionDate" name="admissionDate" required>
                </div>
            </div>

            <!-- Files -->
            <h2>Required Documents</h2>

            <div class="row">
                <div class="field">
                    <label>Upload Photo:</label>
                    <input type="file" accept="image/*" required>
                </div>

                <div class="field">
                    <label>Upload Marksheet:</label>
                    <input type="file" accept=".pdf,.doc,.docx" required>
                </div>

                <div class="field">
                    <label>Upload Signature:</label>
                    <input type="file" accept="image/*,.pdf" required>
                </div>
            </div>

            <button type="submit">Submit Registration</button>

            <div class="message" id="successMsg">
                Registration submitted successfully!
            </div>

        </form>
    </div>

    <script>
        document.getElementById("regForm").addEventListener("submit", function (e) {
            e.preventDefault();
            document.getElementById("successMsg").style.display = "block";
            this.reset();

            setTimeout(() => {
                document.getElementById("successMsg").style.display = "none";
            }, 4000);
        });
    </script>

</body>
</html>
