<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Login/Register Form</title>
    <!-- Using Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

        /* RESET AND BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding-top: 60px; /* Added padding to prevent content overlap with fixed navbar */
        }

        /* NAVBAR STYLES */
        .navbar {
            padding: 10px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            border-top: #7e22ce 4px solid;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 20px;
        }

        .nav-logo {
            color:#9333ea;
            font-size: 24px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-link {
            color:#9333ea;;
            font-size: 16px;
            font-weight: 500;
            padding: 5px 0;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }

        .nav-link:hover {
            border-bottom: 2px solid #fff;
        }
        /* END NAVBAR STYLES */


        /* CONTAINER STYLES */
        .container {
            position: relative;
            width: 850px;
            height: 550px;
            background: #fff;
            margin: 20px;
            border-radius: 30px;
            box-shadow: 0px 0px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            /* Flex layout for forms/toggle boxes */
            display: flex;
        }

        /* TYPOGRAPHY */
        .container h1 {
            font-size: 36px;
            margin: 10px 0;
            font-weight: 700;
        }

        .container p {
            font-size: 14px;
            margin: 15px 0;
            color: rgb(80, 80, 80);
        }

        /* FORM BOX STYLES (General) */
        .form-box {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 40px;
            text-align: center;
            transition: all 0.6s ease-in-out;
        }

        /* Login Form Position (Initial: Left Half) */
        .login-box {
            left: 0;
            opacity: 1;
            z-index: 2;
        }

        /* Register Form Position (Initial: Hidden Off-Screen) */
        .register-box {
            left: 0;
            opacity: 0;
            z-index: 1;
        }
        
        /* CONTAINER ACTIVE STATE - FOR SLIDING */

        /* Slide Forms to the right (100% of their own width, covering the toggle box move) */
        .container.active .login-box {
            transform: translateX(100%);
            opacity: 0;
        }
        .container.active .register-box {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5; /* Bring register form to front when active */
        }
        
        /* FORM CONTROLS */
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .input-box {
            position: relative;
            width: 100%;
            margin: 15px 0;
        }

        .input-box input {
            width: 100%;
            padding: 13px 50px 13px 20px;
            background: #eee;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        .input-box ::placeholder {
            color: #888;
            font-weight: 400;
        }

        .input-box i {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            font-size: 20px;
            color: #888;
        }

        .remember-forgot {
            width: 100%;
            margin: -15px 0 15px;
            text-align: right;
            font-size: 14px;
        }

        .remember-forgot a {
            color: #7e22ce;
            transition: color 0.3s;
        }
        .remember-forgot a:hover {
            color: #5b1793;
        }

        /* BUTTON STYLES */
        .btn {
            width: 100%;
            max-width: 200px; /* Constraint width for aesthetics */
            height: 48px;
            padding: 13px;
            background: #7e22ce;
            border: none;
            outline: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            font-size: 16px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .btn:hover {
            background: #5b1793;
        }
        
        /* SOCIAL MEDIA ICONS */
        .social-media {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        .social-icon {
            width: 40px;
            height: 40px;
            border: 1px solid #7e22ce;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #7e22ce;
            font-size: 20px;
            transition: 0.3s ease;
        }
        .social-icon:hover {
            background-color: #7e22ce;
            color: #fff;
        }
        
        /* TOGGLE BOX / OVERLAY STYLES */
        .toggle-box {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: all 0.6s ease-in-out;
            z-index: 100;
        }

        /* The sliding background panel */
        .toggle-box::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 100%;
            top: 0;
            left: -100%;
            background: linear-gradient(to right, #f7eeff, #9333ea);
            color: #fff;
            transform: translateX(0);
            transition: all 0.6s ease-in-out;
        }

        /* Active state for sliding the background panel */
        .container.active .toggle-box {
            transform: translateX(-100%);
        }

        .container.active .toggle-box::before {
            transform: translateX(50%);
        }

        /* Toggle Panel Content */
        .toggle-panel {
            position: absolute;
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 40px;
            text-align: center;
            color: #fff;
            top: 0;
            transition: all 0.6s ease-in-out;
        }
        
        /* Panel to prompt REGISTER (visible when Login is active) */
        .toggle-panel-register {
            right: 0;
            transform: translateX(0);
            opacity: 1; /* Visible initially */
            pointer-events: all; /* Enabled by default */
        }
        
        /* Panel to prompt LOGIN (visible when Register is active) */
        .toggle-panel-login {
            left: 0;
            transform: translateX(0);
            opacity: 0; /* Hidden initially */
            pointer-events: none; /* Disabled by default, cannot be clicked */
        }

        .toggle-panel h1 {
            color: #fff;
        }
        
        /* Active state for switching panel visibility */
        .container.active .toggle-panel-login {
            transform: translateX(100%);
            opacity: 1; /* Show when active */
            pointer-events: all; /* ENABLE CLICKS when visible */
        }
        .container.active .toggle-panel-register {
            opacity: 0; /* Hide when active */
            pointer-events: none; /* DISABLE CLICKS when hidden */
        }

        /* Reverse logic for when container is NOT active */
        .container:not(.active) .toggle-panel-register {
            opacity: 1; /* Show when inactive */
            pointer-events: all; /* ENABLE CLICKS when visible */
        }
        .container:not(.active) .toggle-panel-login {
            opacity: 0; /* Hide when inactive */
            pointer-events: none; /* DISABLE CLICKS when hidden */
        }
        
        /* Button style inside toggle panel */
        .toggle-panel .btn {
            background: transparent;
            border: 2px solid #fff;
            box-shadow: none;
            transition: 0.3s ease;
        }
        .toggle-panel .btn:hover {
            background: #fff;
            color: #7e22ce;
        }
    </style>
</head>

<body>
    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="nav-content">
            <a href="#" class="nav-logo">
                <i class="fa-solid fa-graduation-cap"></i> App Name
            </a>
            <div class="nav-links">
                <a href="#" class="nav-link">Home</a>
                <a href="#" class="nav-link">About Us</a>
                <a href="#" class="nav-link">Contact</a>
                <a href="#" class="nav-link">Help</a>
            </div>
        </div>
    </nav>
    <!-- END NAVIGATION BAR -->

    <!-- The main container for the forms and the sliding toggle panel -->
    <div class="container" id="container">

        <!-- REGISTER FORM BOX (Sign Up) -->
        <div class="form-box register-box">
            <form action="r.html">
                <h2>Create Account</h2>
                <div class="input-box">
                    <input type="text" placeholder="Username" required>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input type="email" placeholder="Email" required>
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <button type="submit" class="btn">Register</button>
            </form>
        </div>

        <!-- LOGIN FORM BOX (Sign In) -->
        <div class="form-box login-box">
            <form action="#">
                <h2>Login</h2>
                <div class="input-box">
                    <input type="text" placeholder="Username" required>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="remember-forgot">
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <p>Or login with Social Media</p>
                <div class="social-media">
                    <a href="#" class="social-icon">
                        <i class="fab fa-google"></i>
                    </a>
                    <a href="#" class="social-icon">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="#" class="social-icon">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="#" class="social-icon">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                </div>
            </form>
        </div>

        <!-- TOGGLE BOX (The sliding panel with Welcome messages) -->
        <div class="toggle-box">
            
            <!-- Panel that is visible when LOGIN form is active (prompts to login) -->
            <div class="toggle-panel toggle-panel-login">
                <h1>Welcome Back!</h1>
                <p>To keep connected with us please login with your personal info</p>
                <button class="btn" id="login-btn">Login</button>
            </div>
            
            <!-- Panel that is visible when REGISTER form is active (prompts to register) -->
            <div class="toggle-panel toggle-panel-register">
                <h1>Hello, Friend!</h1>
                <p>Enter your personal details to start your journey with us</p>
                <button class="btn" id="register-btn">Register</button>
            </div>

        </div>
    </div>
    
    <script>
        const container = document.getElementById('container');
        const registerBtn = document.getElementById('register-btn');
        const loginBtn = document.getElementById('login-btn');

        // Event listener to switch to Register view
        registerBtn.addEventListener('click', () => {
            container.classList.add('active');
        });

        // Event listener to switch back to Login view
        loginBtn.addEventListener('click', () => {
            container.classList.remove('active');
        });
    </script>
</body>

</html>
